source:
  host: "your-cloud-mysql-host.rds.amazonaws.com"
  port: 3306
  user: "reader"
  password: "your_password"
  database: "source_db"
  charset: "utf8mb4"

target:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "your_password"
  database: "target_db"
  charset: "utf8mb4"

sync:
  parallel_tables: 4
  chunk_size: 50000
  batch_insert_size: 5000
  tables:
    - "table_a"
    - "table_b"
    - "table_c"
